<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
  </head>
  <body>
    <form method="GET" action="/" class="sort-form">

        <input
        type="text"
        name="search"
        placeholder="Search after title or author..."
        value="{{ request.args.get('search', '') }}"
    >

        <label for="sort">Sorting:</label>

        <select name="sort" id="sort">
            <option value="title"
                {% if request.args.get('sort', 'title') == 'title' %}selected{% endif %}>
                Title
            </option>

            <option value="author"
                {% if request.args.get('sort') == 'author' %}selected{% endif %}>
                Author
            </option>
        </select>

        <select name="order" id="order">
            <option value="asc"
                {% if request.args.get('order', 'asc') == 'asc' %}selected{% endif %}>
                Ascending (A-Z)
            </option>

            <option value="desc"
                {% if request.args.get('order') == 'desc' %}selected{% endif %}>
                Descending (Z-A)
            </option>
        </select>

        <input type="submit" value="Sort">

    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="book-list">

        {% for book in books %}
            <div class="book-card">

                <div class="book-info">
                    <h3>{{ book.title }}</h3>

                    <div class="book-author">
                        {{ book.author }}
                    </div>

                    <form method="POST" action="/book/{{book.id}}/delete">
                        <input type="submit" value="Löschen" class="delete-button">
                    </form>
                </div>

                <img
                    src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg"
                    alt="{{ book.title }}"
                >

            </div>
        {% endfor %}

    </div>
  </body>
</html>
