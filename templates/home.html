<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
  </head>
  <body>
    <form method="GET" action="/" class="sort-form">

        <input
        type="text"
        name="search"
        placeholder="Buchtitel oder Autor suchen..."
        value="{{ request.args.get('search', '') }}"
    >

        <label for="sort">Sortieren nach:</label>

        <select name="sort" id="sort">
            <option value="title"
                {% if request.args.get('sort', 'title') == 'title' %}selected{% endif %}>
                Titel
            </option>

            <option value="author"
                {% if request.args.get('sort') == 'author' %}selected{% endif %}>
                Autor
            </option>
        </select>

        <select name="order" id="order">
            <option value="asc"
                {% if request.args.get('order', 'asc') == 'asc' %}selected{% endif %}>
                Aufsteigend (A-Z)
            </option>

            <option value="desc"
                {% if request.args.get('order') == 'desc' %}selected{% endif %}>
                Absteigend (Z-A)
            </option>
        </select>

        <input type="submit" value="Sortieren">

    </form>

    <div class="book-list">

        {% for book in books %}
            <div class="book-card">

                <div class="book-info">
                    <h3>{{ book.title }}</h3>

                    <div class="book-author">
                        {{ book.author }}
                    </div>
                </div>

                <img
                    src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg"
                    alt="{{ book.title }}"
                >

            </div>
        {% endfor %}

    </div>
  </body>
</html>
